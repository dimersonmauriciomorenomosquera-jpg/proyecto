<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Serenity Mode</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/registro.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="contenedor">

    <!--=====================
            LOGO
    ======================-->

    <div class="lado-izquierdo">

        <img src="{{ url_for('static', filename='img/registro1.jpeg') }}"
             alt="Serenity Mode">

    </div>

    <!--=====================
            FORMULARIO
    ======================-->

    <div class="lado-derecho">

        <h1>Serenity Mode</h1>

        <p class="subtitulo">
            Crea tu estilo, vive Serenity Mode
        </p>

        <h2>Crear Cuenta</h2>

        <form id="formRegistro">

            <!-- Nombre -->

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    name="nombre_cliente"
                    placeholder="Nombre completo"
                    required>

            </div>

            <!-- Correo -->

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    name="email_cliente"
                    placeholder="Correo electrónico"
                    required>

            </div>

            <!-- Celular -->

            <div class="input-box">

                <i class="fa-solid fa-phone"></i>

                <input
                    type="text"
                    name="numero_cliente"
                    placeholder="Número de celular"
                    required>

            </div>

            <!-- Dirección -->

            <div class="input-box">

                <i class="fa-solid fa-location-dot"></i>

                <input
                    type="text"
                    name="direccion_cliente"
                    placeholder="Dirección"
                    required>

            </div>

            <!-- Fecha -->

            <div class="input-box">

                <i class="fa-solid fa-calendar-days"></i>

                <input
                    type="date"
                    name="nacimiento_cliente"
                    required>

            </div>

            <!-- Contraseña -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    name="password"
                    placeholder="Contraseña"
                    required>

                <i class="fa-solid fa-eye ojo"></i>

            </div>

            <!-- Confirmar -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    name="confirmar"
                    placeholder="Confirmar contraseña"
                    required>

                <i class="fa-solid fa-eye ojo"></i>

            </div>

            <!-- Checkbox -->

            <div class="terminos">

                <input
                    type="checkbox"
                    required>

                <label>

                    Acepto los
                    <a href="#">términos y condiciones</a>

                </label>

            </div>

            <!-- Botón -->

            <button
                class="btn-registro"
                type="submit">

                Registrarse

            </button>

        </form>

        <!--===================
                LOGIN
        ====================-->

        <div class="login">

            <span>¿Ya tienes cuenta?</span>

            <a href="{{ url_for('auth.login') }}">
                Inicia sesión
            </a>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/registro.js') }}"></script>

</body>
</html>
