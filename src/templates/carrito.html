{% extends "layout.html" %}
{% block contenido %}

<head>
    <title>Carro de Compras</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/carrito.css') }}">
</head>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h1 class="titulo-carrito">
            CARRO<span> COMPRAS</span>
        </h1>

        <p class="resumen">
            Tu estilo comienza aquí
        </p>

        <div class="carrito-img">
            <i class="fa-solid fa-cart-shopping"></i>
        </div>

        <div class="line"></div>

        <div class="total">
            <p>TOTAL</p>
            <h2 id="total">$0</h2>
        </div>

        <button class="pagar" onclick="irAPago()">
            <i class="fa-solid fa-lock"></i>
            FINALIZAR COMPRA
        </button>

        <!-- BOTON SOPORTE -->
        <a href="{{ url_for('soporte') }}" class="link-soporte">

            <button class="soporte">

                <i class="fa-solid fa-headset"></i>
                CONTACTAR SOPORTE

            </button>

        </a>

        <div class="seguro">
            <i class="fa-solid fa-shield"></i>
            <span>Compra 100% segura</span>
        </div>

    </aside>

    <!-- PRODUCTOS -->
    <main class="productos">

        <h2 class="titulo-productos">
            PRODUCTOS EN TU CARRITO
        </h2>

        <div id="carrito"></div>

    </main>

</div>

<script>

let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

// MOSTRAR
function mostrarCarrito() {

    let contenedor = document.getElementById("carrito");

    contenedor.innerHTML = "";

    let total = 0;

    carrito.forEach((item, index) => {

        if(!item.cantidad){
            item.cantidad = 1;
        }

        let subtotal = item.precio * item.cantidad;

        total += subtotal;

        contenedor.innerHTML += `

        <div class="producto">

            <div class="imagen">
                <img src="${item.imagen}">
            </div>

            <div class="info">

                <div class="info-top">

                    <div>

                        <h3 class="nombre">${item.nombre}</h3>

                        <p class="descripcion">
                            ${item.descripcion}
                        </p>

                        <p class="talla">
                            <strong>Talla:</strong>
                            ${item.talla ? item.talla : "Sin talla"}
                        </p>

                    </div>

                    <button class="eliminar"
                    onclick="eliminar(${index})">

                        <i class="fa-solid fa-trash"></i>

                    </button>

                </div>

                <div class="info-bottom">

                    <div class="precios">

                        <p class="precio">
                            Precio: ${formatear(item.precio)}
                        </p>

                        <p class="sub">
                            Subtotal: ${formatear(subtotal)}
                        </p>

                    </div>

                    <div class="cantidad">

                        <button onclick="cambiarCantidad(${index}, -1)">
                            -
                        </button>

                        <span>${item.cantidad}</span>

                        <button onclick="cambiarCantidad(${index}, 1)">
                            +
                        </button>

                    </div>

                </div>

            </div>

        </div>

        `;
    });

    document.getElementById("total").innerText = formatear(total);

    localStorage.setItem("carrito", JSON.stringify(carrito));
}

// CAMBIAR CANTIDAD
function cambiarCantidad(index, valor) {

    carrito[index].cantidad += valor;

    if (carrito[index].cantidad < 1) {
        carrito.splice(index, 1);
    }

    mostrarCarrito();
}

// ELIMINAR
function eliminar(index) {

    carrito.splice(index, 1);

    mostrarCarrito();
}

// FORMATO
function formatear(valor) {

    return "$ " + Number(valor).toLocaleString('es-CO');
}

// INICIAR
mostrarCarrito();

// IR A PAGO
function irAPago(){

    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    if(carrito.length === 0){

        alert("Tu carrito está vacío");

        return;
    }

    window.location.href = "/pago";
}

</script>

{% endblock %}
