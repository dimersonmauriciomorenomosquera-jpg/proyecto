{% extends "layout.html" %}
{% block contenido %}


    <title>Carro de Compras</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/carrito.css') }}">

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h1 class="titulo-carrito">
            CARRO<span> COMPRAS</span>
        </h1>

        <p class="resumen">
            Tu estilo comienza aquí
        </p>

        <div class="carrito-img">
            <i class="fa-solid fa-cart-shopping"></i>
        </div>

        <div class="line"></div>

        <div class="total">
            <p>TOTAL</p>
            <h2 id="total">$0</h2>
        </div>

        

        
        <button class="pagar">                       
            <a href="{{ url_for('envio.index') }}">
            <i class="fa-solid fa-lock"></i>
                CONTINUAR CON EL PAGO
            </a>
        </button>

        <!-- BOTON SOPORTE -->
        <a  class="link-soporte"></a>

            <button class="soporte">

                <i class="fa-solid fa-headset"></i>
                CONTACTAR SOPORTE

            </button>

        </a>

        <div class="seguro">
            <i class="fa-solid fa-shield"></i>
            <span>Compra 100% segura</span>
        </div>

    </aside>

    <!-- PRODUCTOS -->
    <main class="productos">

        <h2 class="titulo-productos">
            PRODUCTOS EN TU CARRITO
        </h2>

        <div id="carrito"></div>

    </main>

</div>

<script src="{{ url_for('static', filename='js/carrito.js') }}"></script>

{% endblock %}
