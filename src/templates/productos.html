{% extends "layout.html" %}

{% block contenido %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/productos.css') }}">

<section class="catalogo">

    

    <!--=================================
                CONTENIDO
    ==================================-->

    <div class="catalogo-contenido">

        <!--=================================
                    FILTROS
        ==================================-->

        <section class="filtros">

            <h2>Filtros</h2>

            <!--=========================
                    BUSCADOR
            =========================-->

            <div class="filtro">

                <h3>Buscar</h3>

                <div class="buscador">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
    type="text"
    id="buscar"
    placeholder="Buscar producto...">

                </div>

            </div>

            <!--=========================
                    CATEGORÍAS
            =========================-->

            <div class="filtro">

    <h3>Categorías</h3>

    <label>
        <input type="radio" name="categoria" value="Todos" checked>
        Todos
    </label>

    <label>
        <input type="radio" name="categoria" value="Ropa">
        Ropa
    </label>

    <label>
        <input type="radio" name="categoria" value="Zapatos">
        Zapatos
    </label>

    <label>
        <input type="radio" name="categoria" value="Accesorios">
        Accesorios
    </label>

</div>

            

            <!--=========================
                    ORDENAR
            =========================-->

            <div class="filtro">

                <h3>Ordenar</h3>

                <select id="ordenar">

    <option value="">Relevancia</option>
    <option value="recientes">Más recientes</option>
    <option value="vendidos">Más vendidos</option>
    <option value="precio_asc">Precio menor</option>
    <option value="precio_desc">Precio mayor</option>
    <option value="nombre">Nombre A-Z</option>

</select>

            </div>

            <!--=========================
                LIMPIAR
            =========================-->

            <button class="btn-limpiar" id="limpiar">

    <i class="fa-solid fa-filter-circle-xmark"></i>

    Limpiar filtros

</button>

        </section>

        <!--=================================
                GRID PRODUCTOS
        ==================================-->
        <section class="productos-grid" id="productos-grid">

</section>
        

    </div>

    <div id="paginacion" class="paginacion"></div>

</section>
<script src="{{ url_for('static', filename='js/productos.js') }}"></script>

{% endblock %}
